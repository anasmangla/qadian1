<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
  <title id="title">Noor Hospital and service to humanity</title>
  <desc id="desc">An original diary illustration of Noor Hospital in Qadian with hands holding a heart, representing compassionate service.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#e4f2f7"/></linearGradient></defs><rect width="1600" height="1067" fill="url(#bg)"/><path d="M0 860h1600v207H0z" fill="#d8e6ec"/>
  <text x="130" y="132" fill="#c66f00" font-family="Open Sans,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="6">NOVEMBER 28 · QADIAN</text><text x="130" y="240" fill="#13242d" font-family="Open Sans,Arial,sans-serif" font-size="82" font-weight="800">SERVICE TO HUMANITY</text>

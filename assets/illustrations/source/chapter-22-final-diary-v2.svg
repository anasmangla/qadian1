<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
  <title id="title">A final message from the Qadian Diary</title><desc id="desc">An original closing illustration of an open travel diary with a handwritten message of love, gratitude, and prayer from Anas Mangla.</desc>
  <defs><linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13242d"/><stop offset="1" stop-color="#264858"/></linearGradient></defs>
  <rect width="1600" height="1067" fill="url(#desk)"/><path d="M0 150Q400 20 800 145T1600 150" fill="none" stroke="#f79007" stroke-width="9" stroke-dasharray="22 24" opacity=".9"/><circle cx="110" cy="126" r="17" fill="#f79007"/><circle cx="1490" cy="126" r="17" fill="#0077b8"/>
  <path d="M155 257c215-40 425-13 630 82v595c-205-95-415-122-630-82z" fill="#081116" opacity=".28"/><path d="M1445 257c-215-40-425-13-630 82v595c205-95 415-122 630-82z" fill="#081116" opacity=".28"/>
  <g><path d="M155 235c215-40 425-13 630 82v595c-205-95-415-122-630-82z" fill="#fffdf7"/><path d="M1445 235c-215-40-425-13-630 82v595c205-95 415-122 630-82z" fill="#fffdf7"/><path d="M800 315v598" stroke="#d8e6ec" stroke-width="10"/></g>
  <text x="235" y="382" fill="#c66f00" font-family="Open Sans,Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="5">THE QADIAN DIARY</text><text x="235" y="484" fill="#13242d" font-family="Open Sans,Arial,sans-serif" font-size="66" font-weight="800">A FINAL</text><text x="235" y="560" fill="#13242d" font-family="Open Sans,Arial,sans-serif" font-size="66" font-weight="800">MESSAGE</text><path d="M235 618h425" stroke="#d8e6ec" stroke-width="6"/><text x="235" y="686" fill="#426b7c" font-family="Source Serif 4,Georgia,serif" font-size="34">Prayer · Love · Gratitude</text>
  <g transform="translate(1010 290) scale(.75)"><path d="M125 262h250V142h-30V58h-48V0h-44v58h-48v84h-30v120z" fill="#13242d"/><path d="M175 262h150v122H175z" fill="#13242d"/><circle cx="250" cy="156" r="31" fill="#fff"/><path d="M250 134v24l16 10" fill="none" stroke="#13242d" stroke-width="7" stroke-linecap="round"/></g>
  <text x="930" y="650" fill="#426b7c" font-family="Source Serif 4,Georgia,serif" font-size="32">Please keep me and my family</text><text x="930" y="690" fill="#426b7c" font-family="Source Serif 4,Georgia,serif" font-size="32">in your prayers.</text><text x="930" y="746" fill="#13242d" font-family="Source Serif 4,Georgia,serif" font-size="39" font-style="italic">With love and gratitude,</text><text x="930" y="798" fill="#0077b8" font-family="Open Sans,Arial,sans-serif" font-size="45" font-weight="800">Anas Mangla</text>
</svg>
